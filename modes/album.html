.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.drawer-title{font-size:19px;font-weight:700;letter-spacing:-.3px}.drawer-close{width:34px;height:34px;border:0;border-radius:50%;background:#29292d;color:#ddd;display:grid;place-items:center}.drawer-subtitle{font-size:12px;color:#85858b;margin:0 0 18px}.song-list{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:1;min-height:50px}.song-row{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:8px;border:0;border-radius:12px;background:transparent;text-align:left}.song-row:hover,.song-row.current{background:#29292d}.song-art{width:44px;height:44px;border-radius:8px;overflow:hidden;background:#202024;display:grid;place-items:center}.song-art img{width:100%;height:100%;object-fit:cover}.song-name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-by{font-size:10px;color:#898990;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-time{font-size:10px;color:#85858c;text-align:right}.empty-state{padding:28px 10px;text-align:center;color:#77777f;font-size:12px;line-height:1.65}.drawer-actions{display:flex;gap:9px;padding-top:13px;border-top:1px solid #2c2c30;margin-top:12px}.drawer-action{flex:1;height:42px;border:1px solid #37373c;background:#242427;border-radius:12px;color:#e6e6e9;font-size:12px;font-weight:600}.drawer-action.primary{background:#ededf0;color:#121214;border-color:#ededf0}

.toast{position:fixed;z-index:40;left:50%;bottom:31px;transform:translate(-50%,12px);max-width:calc(100vw - 32px);padding:11px 15px;border:1px solid #3b3b40;border-radius:30px;background:#252528;color:#f5f5f7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}

 function updateMeta(){const s=activeSong();const cover=coverFor(s);$('trackTitle').textContent=s?s.title:'GANDENG 2 melody x sekajam itu';$('trackArtist').textContent=s?s.artist:'777';$('coverImage').src=cover;$('coverPreview').src=cover;$('ambientBg').style.backgroundImage=`linear-gradient(135deg,rgba(5,5,7,.42),rgba(5,5,7,.62)),url("${cover}")`;$('favoriteBtn').classList.toggle('active',!!(s&&s.favorite));$('favoriteBtn').setAttribute('aria-pressed',String(!!(s&&s.favorite)));$('favoriteBtn').setAttribute('aria-label',s&&s.favorite?'Hapus dari favorit':'Tambahkan ke favorit');$('drawerSubtitle').textContent=`${songs.length} lagu ditambahkan`;renderSongs();updateProgress()}
 function updatePlay(){const playing=!audio.paused&&!audio.ended;$('app').classList.toggle('is-playing',playing);$('playIcon').innerHTML=playing?icons.pause:icons.play;$('playBtn').setAttribute('aria-label',playing?'Jeda':'Putar');$('playBtn').title=playing?'Jeda':'Putar'}
 function updateProgress(){const dur=Number.isFinite(audio.duration)?audio.duration:0,cur=audio.currentTime||0,p=dur?Math.max(0,Math.min(100,cur/dur*100)):0;$('seekbar').value=String(Math.round(p*10));$('seekbar').style.setProperty('--seek-fill',`${p}%`);$('elapsed').textContent=fmt(cur);$('remaining').textContent=`-${fmt(Math.max(0,dur-cur))}`}
 function renderSongs(){const list=$('songList');if(!songs.length){list.innerHTML='<div class="empty-state">Belum ada lagu.<br>Tambahkan file audio dari perangkat kamu.</div>';return}list.innerHTML='';songs.forEach((s,i)=>{const row=document.createElement('button');row.type='button';row.className='song-row'+(i===currentIndex?' current':'');const art=document.createElement('div');art.className='song-art';const im=document.createElement('img');im.src=coverFor(s);im.alt='';art.appendChild(im);const info=document.createElement('div');info.style.minWidth='0';const name=document.createElement('div');name.className='song-name';name.textContent=s.title;const by=document.createElement('div');by.className='song-by';by.textContent=s.artist;info.append(name,by);const time=document.createElement('div');time.className='song-time';time.textContent=s.duration?fmt(s.duration):'—:—';row.append(art,info,time);row.addEventListener('click',()=>{selectSong(i,true);closeLibrary()});list.appendChild(row)})}
 function selectSong(i,autoplay=false){if(i<0||i>=songs.length)return;currentIndex=i;audio.src=songs[i].url;audio.load();updateMeta();updatePlay();if(autoplay){audio.play().then(updatePlay).catch(()=>{updatePlay();toast('Tekan tombol putar untuk memulai lagu.')})}}
 function addFiles(files){const arr=Array.from(files||[]).filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|m4a|aac|ogg|flac|opus|aiff?)$/i.test(f.name));if(!arr.length){toast('Pilih file audio terlebih dahulu.');return}arr.forEach(file=>songs.push({file,url:URL.createObjectURL(file),title:safeName(file.name),artist:'Artis tidak diketahui',coverUrl:'',duration:0}));if(currentIndex<0)selectSong(0,false);else updateMeta();toast(`${arr.length} lagu ditambahkan.`);audioInput.value=''}
 function togglePlay(){if(!songs.length){audioInput.click();return}if(audio.paused){audio.play().then(updatePlay).catch(()=>toast('File ini tidak dapat diputar di browser.'))}else audio.pause()}
 function next(){if(!songs.length){audioInput.click();return}selectSong((currentIndex+1)%songs.length,true)}
 function prev(){if(!songs.length){audioInput.click();return}if(audio.currentTime>3){audio.currentTime=0;updateProgress();return}selectSong((currentIndex-1+songs.length)%songs.length,true)}
 function openLibrary(){$('libraryDrawer').classList.add('open');$('drawerBackdrop').classList.add('open');$('libraryDrawer').setAttribute('aria-hidden','false')}
 function closeLibrary(){$('libraryDrawer').classList.remove('open');$('drawerBackdrop').classList.remove('open');$('libraryDrawer').setAttribute('aria-hidden','true')}
 function openEdit(){const s=activeSong();if(!s){toast('Tambahkan lagu dulu, lalu informasi dan cover bisa diedit.');audioInput.click();return}$('editTitle').value=s.title;$('editArtist').value=s.artist;$('coverPreview').src=coverFor(s);$('editModal').classList.add('open');setTimeout(()=>$('editTitle').focus(),70)}
 function closeEdit(){$('editModal').classList.remove('open')}
 function updateVolumeUi(){const v=muted?0:Number(audio.volume);$('volume').value=String(v);$('volume').style.setProperty('--volume-fill',`${v*100}%`);$('muteIcon').innerHTML=v===0?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/>';$('muteBtn').title=v===0?'Nyalakan suara':'Bisukan suara'}
 $('playBtn').addEventListener('click',togglePlay);$('prevBtn').addEventListener('click',prev);$('innerPrevBtn').addEventListener('click',prev);$('nextBtn').addEventListener('click',next);$('innerNextBtn').addEventListener('click',next);
 $('favoriteBtn').addEventListener('click',()=>{const s=activeSong();if(!s){toast('Tambahkan lagu terlebih dahulu.');audioInput.click();return}s.favorite=!s.favorite;$('favoriteBtn').classList.toggle('active',s.favorite);$('favoriteBtn').setAttribute('aria-pressed',String(s.favorite));$('favoriteBtn').setAttribute('aria-label',s.favorite?'Hapus dari favorit':'Tambahkan ke favorit');toast(s.favorite?'Lagu ditambahkan ke favorit.':'Lagu dihapus dari favorit.')});
 $('libraryBtn').addEventListener('click',openLibrary);$('drawerClose').addEventListener('click',closeLibrary);$('drawerBackdrop').addEventListener('click',closeLibrary);$('addBtn').addEventListener('click',()=>audioInput.click());$('clearBtn').addEventListener('click',()=>{if(!songs.length){toast('Library sudah kosong.');return}audio.pause();audio.removeAttribute('src');audio.load();songs.forEach(s=>{URL.revokeObjectURL(s.url);if(s.coverUrl)URL.revokeObjectURL(s.coverUrl)});songs.splice(0,songs.length);currentIndex=-1;updateMeta();updatePlay();closeLibrary();toast('Semua lagu dihapus dari sesi ini.')});
 audioInput.addEventListener('change',()=>addFiles(audioInput.files));
 $('seekbar').addEventListener('input',()=>{const p=Number($('seekbar').value)/1000;$('seekbar').style.setProperty('--seek-fill',`${p*100}%`);if(Number.isFinite(audio.duration)&&audio.duration>0){audio.currentTime=audio.duration*p;updateProgress()}});
 $('volume').addEventListener('input',()=>{const v=Number($('volume').value);audio.volume=v;muted=v===0;if(v>0)lastVolume=v;updateVolumeUi()});$('muteBtn').addEventListener('click',()=>{if(muted||audio.volume===0){muted=false;audio.volume=lastVolume||.8}else{lastVolume=audio.volume||lastVolume;muted=true;audio.volume=0}updateVolumeUi()});$('volumeIconBtn').addEventListener('click',()=>{const v=Number($('volume').value);audio.volume=Math.min(1,v+.1);muted=false;lastVolume=audio.volume;updateVolumeUi()});
 $('twsBtn').addEventListener('click',()=>{twsOn=!twsOn;$('twsBtn').classList.toggle('active',twsOn);$('twsBtn').setAttribute('aria-pressed',String(twsOn));$('twsLabel').textContent='Windows 17 Pro';toast(twsOn?'Indikator Windows 17 Pro aktif (tampilan saja).':'Indikator Windows 17 Pro nonaktif.')});
 $('coverButton').addEventListener('click',()=>{if(!activeSong()){toast('Tambahkan lagu dulu untuk memasang cover sendiri.');audioInput.click();return}coverInput.click()});$('coverChangeBtn').addEventListener('click',()=>coverInput.click());coverInput.addEventListener('change',()=>{const f=coverInput.files&&coverInput.files[0];if(!f)return;const s=activeSong();if(!s){toast('Pilih lagu terlebih dahulu.');coverInput.value='';return}if(s.coverUrl)URL.revokeObjectURL(s.coverUrl);s.coverUrl=URL.createObjectURL(f);customCoverUrl=s.coverUrl;$('coverImage').src=s.coverUrl;$('coverPreview').src=s.coverUrl;renderSongs();coverInput.value='';toast('Cover lagu diperbarui.')});
 $('editMetaBtn').addEventListener('click',openEdit);$('cancelEdit').addEventListener('click',closeEdit);$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});$('saveEdit').addEventListener('click',()=>{const s=activeSong();if(!s)return;s.title=$('editTitle').value.trim()||safeName(s.file.name);s.artist=$('editArtist').value.trim()||'Artis tidak diketahui';updateMeta();closeEdit();toast('Informasi lagu disimpan.')});
 audio.addEventListener('loadedmetadata',()=>{const s=activeSong();if(s)s.duration=audio.duration||0;renderSongs();updateProgress()});audio.addEventListener('timeupdate',updateProgress);audio.addEventListener('durationchange',updateProgress);audio.addEventListener('play',updatePlay);audio.addEventListener('pause',updatePlay);audio.addEventListener('ended',()=>{updatePlay();if(currentIndex<songs.length-1)next()});audio.addEventListener('error',()=>{if(activeSong())toast('File ini tidak didukung atau tidak bisa dibuka.');updatePlay()});
 $('app').addEventListener('dragover',e=>e.preventDefault());$('app').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLibrary();closeEdit()}if(e.target.matches('input,textarea'))return;if(e.key.toLowerCase()==='l'){e.preventDefault();openLibrary()}if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next()});
 const refreshStatusTime=()=>{const d=new Date();$('statusTime').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}).replace(/^0/,'')};refreshStatusTime();setInterval(refreshStatusTime,30000);
 audio.volume=.92;updateVolumeUi();updateMeta();updatePlay();
})();
</script>
</body>
